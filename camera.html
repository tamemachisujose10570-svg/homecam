<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f1115">
  <title>监控相机端</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>监控相机端</h1>
      <p class="sub">在作为摄像头的 iPhone 上打开此页面</p>
    </header>

    <div class="card" id="setupCard">
      <label for="codeInput">设备码（观看端需输入相同设备码，至少 6 位）</label>
      <div class="row" style="margin-top:6px">
        <input type="text" id="codeInput" maxlength="32" autocomplete="off" placeholder="例如 888888" style="flex:1">
        <button type="button" id="genBtn" class="secondary">随机</button>
      </div>
      <div class="row">
        <button type="button" id="startBtn" style="flex:1">开始监控</button>
      </div>
      <ul class="tips">
        <li>连接电源，进入 设置 → 显示与亮度 → 自动锁定 → 永不</li>
        <li>保持此页面在前台（视频播放可防止息屏），勿退出 Safari</li>
        <li>建议把屏幕亮度调低，保护屏幕</li>
        <li>设备码相当于密码，请勿告诉无关人员</li>
      </ul>
    </div>

    <div class="card" id="runCard" hidden>
      <label>设备码（在观看端输入此码即可查看）</label>
      <div class="code-display" id="codeDisplay"></div>
      <div class="row">
        <button type="button" id="copyBtn" class="secondary">复制设备码</button>
        <button type="button" id="switchBtn" class="secondary">切换前后摄像头</button>
        <button type="button" id="stopBtn" class="secondary">停止</button>
      </div>
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">正在初始化…</span></div>
      <video id="preview" autoplay muted playsinline style="margin-top:14px"></video>
    </div>

    <div class="card" id="galleryCard" hidden>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2 style="font-size:16px">本机移动侦测截图</h2>
        <button type="button" id="clearBtn" class="secondary" style="padding:8px 12px;font-size:13px">清空</button>
      </div>
      <div class="grid" id="gallery"></div>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden>
    <img id="overlayImg" alt="">
    <button type="button" class="overlay-close" id="overlayClose">关闭</button>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/camera.js"></script>
</body>
</html>
